# Rebuilds sillapps.com/scioperi/ (Scioperi Oggi) from the official MIT strike
# list every hour. Commits only when the page changed (new list or new day).
# The script fails at most once a day, when the list has been unreadable
# for more than 36 hours: GitHub then e-mails the owner.
name: scioperi-oggi
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scioperi-oggi
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scioperi/build_oggi.py
      - name: Commit if changed
        run: |
          git diff --quiet -- scioperi/index.html && exit 0
          git config user.name "sillapps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scioperi/index.html
          git commit -m "scioperi: page of $(TZ=Europe/Rome date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
