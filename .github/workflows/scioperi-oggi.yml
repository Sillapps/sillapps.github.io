# Rebuilds sillapps.com/scioperi/ (Scioperi Oggi) from the official MIT strike
# list every hour. Commits only when the page changed (new list or new day),
# with its sitemap <lastmod>. Also rebuilds the Placa Hoy city pages, which
# change when a period ends.
# The script fails at most once a day, when the list has been unreadable
# for more than 36 hours: GitHub then e-mails the owner.
name: scioperi-oggi
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scioperi-oggi
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scioperi/build_oggi.py
      # Drops the Placa Hoy periods that have ended (the pages list the
      # current and next ones only).
      - run: python3 placa-hoy/build_pages.py
      - name: Commit if changed
        run: |
          git diff --quiet -- scioperi/index.html placa-hoy && exit 0
          git diff --quiet -- scioperi/index.html || python3 tools/sitemap_lastmod.py scioperi/index.html
          git config user.name "sillapps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scioperi/index.html placa-hoy sitemap.xml
          if git diff --cached --quiet -- scioperi/index.html; then
            git commit -m "placa-hoy: drop the periods that ended ($(TZ=America/Bogota date +%F))"
          else
            git commit -m "scioperi: page of $(TZ=Europe/Rome date +%F)"
          fi
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
