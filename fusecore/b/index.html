<!doctype html>
<html lang="en" data-app="fusecore">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d18" />
    <meta name="robots" content="noindex" />
    <title>Fusecore build</title>
    <meta name="description" content="A Fusecore build shared by a player." />
    <link rel="icon" type="image/png" href="/fusecore/icon-192.png" />
    <link rel="stylesheet" href="/fonts/fonts.css?v=20260930-1" />
    <link rel="stylesheet" href="/styles.css?v=20261011-1" />
    <style>
      .bp-grid { display: block; width: 100%; max-width: 360px; height: auto; margin: 4px auto 0; }
      .bp-tile-name { font-family: var(--font-display); font-weight: 800; font-size: 15px; fill: #0b0d18; text-anchor: middle; dominant-baseline: central; }
      .bp-count { margin: 18px 0 6px; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.02em; }
      .bp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .section .bp-list { margin: 0; padding: 0; max-width: none; }
      .section .bp-list li { color: var(--text); padding: 0; }
      .bp-list li { display: flex; gap: 10px; align-items: baseline; line-height: 1.4; }
      .bp-dot { flex: none; width: 12px; height: 12px; border-radius: 50%; transform: translateY(1px); }
      .bp-n { color: var(--faint); margin-left: 6px; font-weight: 600; }
      .bp-who { font-weight: 700; }
      .bp-sub { color: var(--muted); }
      .bp-actions { display: grid; gap: 10px; margin: 22px 0 0; }
      .bp-btn { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 18px; border-radius: 12px 0; font-family: var(--font-display); font-weight: 800; font-size: 1rem; letter-spacing: 0.02em; text-decoration: none; text-align: center; border: 2px solid var(--accent); }
      .bp-btn.primary { background: var(--accent); color: var(--accent-ink); }
      .bp-btn.secondary { background: transparent; color: var(--accent); }
      .bp-code { display: flex; gap: 8px; align-items: stretch; margin: 22px 0 8px; }
      .bp-code code { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg-2); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9rem; line-height: 1.4; overflow-wrap: anywhere; user-select: all; }
      .bp-copy { flex: none; min-width: 84px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-3); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
      .bp-how { margin: 0; color: var(--muted); font-size: 0.95rem; }
      .bp-invalid { font-size: 1.1rem; margin: 18px 0 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel hero">
        <div class="panel-inner">
          <div class="nav-row">
            <a class="back-link" href="/fusecore/">Fusecore</a>
          </div>

          <div class="masthead">
            <div>
              <p class="eyebrow">Fusecore</p>
              <h1 class="title" id="shared">A player shares their Fusecore build</h1>
            </div>
            <img class="app-mark" src="/fusecore/icon-192.png" alt="" width="76" height="76" />
          </div>

          <div id="build" hidden>
            <svg id="grid" class="bp-grid" viewBox="0 0 300 300" role="img" aria-label=""></svg>
            <p class="bp-count" id="count"></p>
            <ul class="bp-list" id="reactions"></ul>
            <div class="section" style="margin-top: 18px">
              <ul class="bp-list" id="talents"></ul>
            </div>
          </div>

          <p class="bp-invalid" id="invalid" hidden></p>

          <div class="bp-actions" id="actions"></div>

          <div class="bp-code" id="codebox" hidden>
            <code id="code"></code>
            <button type="button" class="bp-copy" id="copy"></button>
          </div>
          <p class="bp-how" id="how" hidden></p>
        </div>
      </section>
    </main>

        function pickLang() {
          var list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']);
          for (var i = 0; i < list.length; i++) {
            var l = String(list[i] || '').toLowerCase().replace('_', '-');
            var base = l.split('-')[0];
            if (base === 'zh') return /hant|-tw|-hk|-mo/.test(l) ? 'zh_hant' : 'zh_hans';
            if (base === 'in') return 'id';
            if (NAMES[base]) return base;
          }
          return 'en';
        }
        var LANG = pickLang();
        document.documentElement.lang = LANG === 'zh_hant' ? 'zh-Hant' : LANG === 'zh_hans' ? 'zh-Hans' : LANG === 'pt' ? 'pt-BR' : LANG;
        var N = NAMES[LANG], U = UI[LANG];
        function nm(key) { return N[key] || NAMES.en[key] || key; }

        // ---- Code FC1 (same format as lib/shared/build_code.dart).
        var ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
        var TOWERS = ['pulse', 'photon', 'nova', 'cryo'];
        var OWN = {
          pulse: ['pulse_conductivity', 'pulse_intensify', 'pulse_concentrate', 'pulse_overvolt'],
          photon: ['photon_sniper', 'photon_orbital', 'photon_shatter', 'photon_lens'],
          nova: ['nova_propagate', 'nova_replicate', 'nova_inferno', 'nova_wildfire'],
          cryo: ['cryo_crystallise', 'cryo_permafrost', 'cryo_aura', 'cryo_focus', 'cryo_spread']
        };
        var GENERIC = ['gen_rebound', 'gen_split', 'gen_multistrike', 'gen_overcharge', 'gen_overclock', 'gen_longrange', 'gen_catalyst'];
        var CORE = ['core_life', 'core_regen', 'core_shield', 'core_counter', 'core_capacity', 'core_fortress', 'core_regenerator', 'core_glass'];

        function checksum(d) {
          var s = 0;
          for (var i = 0; i < d.length; i++) s = (s + d[i] * (i % 7 + 1)) % 31;
          return s;
        }

        // The normalised code ('FC1-' + digits) found in text, or null.
        function findCode(text) {
          var m = /FC1[-\s]*([0-9A-Za-z][0-9A-Za-z\-\s]*)/i.exec(text);
          if (!m) return null;
          var body = m[1].replace(/[-\s]/g, '');
          return body ? 'FC1-' + body : null;
        }

        // { slots: [{tower, talents[]} | null x9], core: [] } or null when invalid.
        function decode(text) {
          var code = findCode(text);
          if (!code) return null;
          var d = [];
          var chars = code.slice(4).toUpperCase().split('');
          for (var i = 0; i < chars.length; i++) {
            var c = chars[i];
            if (c === 'O') c = '0';
            else if (c === 'I' || c === 'L') c = '1';
            var v = ALPHABET.indexOf(c);
            if (v < 0) return null;
            d.push(v);
          }
          if (d.length < 2) return null;
          var check = d.pop();
          if (checksum(d) !== check) return null;
          var bits = [];
          for (var j = 0; j < d.length; j++) for (var b = 4; b >= 0; b--) bits.push((d[j] >> b) & 1);
          var at = 0, bad = false;
          function read(w) {
            if (at + w > bits.length) { bad = true; return 0; }
            var x = 0;
            for (var k = 0; k < w; k++) x = (x << 1) | bits[at++];
            return x;
          }
          var slots = [];
          for (var s = 0; s < 9; s++) {
            var t = read(3) - 1;
            if (bad) return null;
            if (t < 0) { slots.push(null); continue; }
            if (read(1)) read(3); // targeting: read, not shown
            var n = read(3);
            if (bad || n > 4) return null;
            var tower = t < TOWERS.length ? TOWERS[t] : null;
            var own = tower ? OWN[tower] : [];
            var talents = [];
            for (var q = 0; q < n; q++) {
              var tv = read(5);
              var id = tv === 0 ? '' : tv < 16 ? (tv - 1 < own.length ? own[tv - 1] : '') : (tv - 16 < GENERIC.length ? GENERIC[tv - 16] : '');
              talents.push(id);
            }
            if (bad) return null;
            slots.push(tower ? { tower: tower, talents: talents } : null);
          }
          var core = [];
          for (var ci = 0; ci < 2; ci++) {
            var cv = read(4);
            core.push(cv === 0 || cv > CORE.length ? '' : CORE[cv - 1]);
          }
          if (bad) return null;
          var left = bits.length - at;
          if (left >= 5) return null;
          for (var z = at; z < bits.length; z++) if (bits[z]) return null;
          return { code: code, slots: slots, core: core.filter(Boolean) };
        }

        // Display form: FC1-XXXX-XXXX-...
        function pretty(code) {
          var body = code.slice(4).toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1');
          var out = [];
          for (var i = 0; i < body.length; i += 4) out.push(body.slice(i, i + 4));
          return 'FC1-' + out.join('-');
        }

        // ---- Colors and reactions.
        var COLOR = { pulse: '#FF8A00', photon: '#A84CFF', nova: '#FF2B2B', cryo: '#00E5FF' };
        var REACTIONS = {
          'photon,pulse': ['reaction.railgun', '#FFFFFF'],
          'nova,pulse': ['reaction.overload', '#FF9900'],
          'cryo,pulse': ['reaction.superconduction', '#2AF6FF'],
          'nova,photon': ['reaction.detonation', '#FF4444'],
          'cryo,photon': ['reaction.avalanche', '#44FF99'],
          'cryo,nova': ['reaction.thermalShock', '#7CF0FF']
        };
        var RESONANCE = '#C9CEDD';
        var SVGNS = 'http://www.w3.org/2000/svg';

        function el(name, attrs, text) {
          var e = document.createElementNS(SVGNS, name);
          for (var k in attrs) e.setAttribute(k, attrs[k]);
          if (text != null) e.textContent = text;
          return e;
        }
        function h(tag, cls, text) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          return e;
        }
        function $(id) { return document.getElementById(id); }
        function fmt(s, n) { return s.replace('{n}', n); }

        function drawGrid(slots) {
          var svg = $('grid');
          var SIZE = 84, GAP = 24, STEP = SIZE + GAP;
          var reactions = {}, total = 0;
          svg.setAttribute('aria-label', slots.map(function (s) { return s ? nm('tower.' + s.tower) : '-'; }).join(', '));
          for (var i = 0; i < 9; i++) {
            var s = slots[i];
            var x = (i % 3) * STEP, y = Math.floor(i / 3) * STEP;
            if (!s) {
              svg.appendChild(el('rect', { x: x + 1, y: y + 1, width: SIZE - 2, height: SIZE - 2, rx: 14, fill: 'none', stroke: '#2c3352', 'stroke-width': 2, 'stroke-dasharray': '5 5' }));
              continue;
            }
            svg.appendChild(el('rect', { x: x, y: y, width: SIZE, height: SIZE, rx: 14, fill: COLOR[s.tower] }));
            svg.appendChild(el('text', { x: x + SIZE / 2, y: y + SIZE / 2, 'class': 'bp-tile-name' }, nm('tower.' + s.tower)));
          }
          // Dots on the edges between orthogonal neighbours.
          for (var a = 0; a < 9; a++) {
            var neighbours = [];
            if (a % 3 < 2) neighbours.push(a + 1);
            if (a < 6) neighbours.push(a + 3);
            for (var k = 0; k < neighbours.length; k++) {
              var b = neighbours[k], sa = slots[a], sb = slots[b];
              if (!sa || !sb) continue;
              var cx = ((a % 3) + (b % 3)) / 2 * STEP + SIZE / 2;
              var cy = (Math.floor(a / 3) + Math.floor(b / 3)) / 2 * STEP + SIZE / 2;
              if (sa.tower === sb.tower) {
                svg.appendChild(el('circle', { cx: cx, cy: cy, r: 6, fill: RESONANCE, opacity: 0.55, stroke: '#0b0d18', 'stroke-width': 2 }));
              } else {
                var r = REACTIONS[[sa.tower, sb.tower].sort().join(',')];
                svg.appendChild(el('circle', { cx: cx, cy: cy, r: 8, fill: r[1], stroke: '#0b0d18', 'stroke-width': 2.5 }));
                reactions[r[0]] = reactions[r[0]] || { color: r[1], n: 0 };
                reactions[r[0]].n++;
                total++;
              }
            }
          }
          return { reactions: reactions, total: total };
        }

        function render(build) {
          $('build').hidden = false;
          var res = drawGrid(build.slots);
          $('count').textContent = fmt(res.total === 1 && U.reaction1 ? U.reaction1 : U.reactions, res.total);
          var rl = $('reactions');
          Object.keys(res.reactions).sort().forEach(function (key) {
            var r = res.reactions[key];
            var li = h('li');
            var dot = h('span', 'bp-dot'); dot.style.background = r.color;
            li.appendChild(dot);
            var t = h('span', 'bp-who', nm(key));
            t.appendChild(h('span', 'bp-n', '×' + r.n));
            li.appendChild(t);
            rl.appendChild(li);
          });
          var tl = $('talents'), any = false;
          build.slots.forEach(function (s) {
            if (!s) return;
            var names = s.talents.filter(Boolean).map(function (id) { return nm('talent.' + id); });
            if (!names.length) return;
            any = true;
            var li = h('li');
            var dot = h('span', 'bp-dot'); dot.style.background = COLOR[s.tower];
            li.appendChild(dot);
            var box = h('span');
            box.appendChild(h('span', 'bp-who', nm('tower.' + s.tower) + ': '));
            box.appendChild(h('span', 'bp-sub', names.join(', ')));
            li.appendChild(box);
            tl.appendChild(li);
          });
          if (build.core.length) {
            any = true;
            var li = h('li');
            var dot = h('span', 'bp-dot'); dot.style.background = '#FFB238';
            li.appendChild(dot);
            var box = h('span');
            box.appendChild(h('span', 'bp-who', U.core + ': '));
            box.appendChild(h('span', 'bp-sub', build.core.map(function (id) { return nm('talent.' + id); }).join(', ')));
            li.appendChild(box);
            tl.appendChild(li);
          }
          if (!any) tl.parentNode.hidden = true;
        }

        function link(href, label, primary) {
          var a = h('a', 'bp-btn ' + (primary ? 'primary' : 'secondary'), label);
          a.href = href;
          return a;
        }

        function showButtons(code) {
          var box = $('actions');
          var ua = navigator.userAgent || '';
          var android = /Android/i.test(ua);
          var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (android) {
            if (code) {
              box.appendChild(link('intent://b/' + code + '#Intent;scheme=fusecore;package=' + PACKAGE + ';S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end', U.open, true));
            } else {
              box.appendChild(link(PLAY_URL, U.play, true));
            }
          } else if (ios) {
            if (code) box.appendChild(link('fusecore://b/' + code, U.open, true));
            box.appendChild(link(APP_STORE_URL || IOS_PAGE_URL, U.ios, !code));
          } else {
            box.appendChild(link(PLAY_URL, U.play, true));
            box.appendChild(link(APP_STORE_URL || IOS_PAGE_URL, U.ios, false));
          }
        }

        function showCode(code) {
          $('codebox').hidden = false;
          $('code').textContent = code;
          var btn = $('copy');
          btn.textContent = U.copy;
          var timer = null;
          btn.addEventListener('click', function () {
            function done() {
              btn.textContent = U.copied;
              clearTimeout(timer);
              timer = setTimeout(function () { btn.textContent = U.copy; }, 1800);
            }
            function fallback() {
              var range = document.createRange();
              range.selectNodeContents($('code'));
              var sel = window.getSelection();
              sel.removeAllRanges();
              sel.addRange(range);
              try { if (document.execCommand('copy')) done(); } catch (e) { /* the text stays selected */ }
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(code).then(done, fallback);
            } else {
              fallback();
            }
          });
          $('how').hidden = false;
          $('how').textContent = U.in + ': ' + nm('tab.build') + ' › ' + nm('preset.title') + ' › ' + U.paste;
        }

        // ---- Start.
        $('shared').textContent = U.shared;
        var frag = location.hash.replace(/^#/, '');
        try { frag = decodeURIComponent(frag); } catch (e) { /* keep the raw text */ }
        var build = frag ? decode(frag) : null;
        if (build) {
          var code = pretty(build.code);
          render(build);
          showButtons(code);
          showCode(code);
        } else {
          $('invalid').hidden = false;
          $('invalid').textContent = U.invalid;
          showButtons(null);
        }
      })();
    </script>
